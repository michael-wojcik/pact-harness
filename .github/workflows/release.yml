name: release

# A tag is a promise: it says the tree at that commit passed the suite, the pin
# is intact, and the version in every manifest agrees with the tag. This lane
# checks those three before it builds anything, then attaches the artifacts to a
# GitHub release and, when enabled, publishes to PyPI and npm.
#
# Both registries use trusted publishing (OIDC): no long-lived registry tokens are
# stored. npm's trusted publisher must name the 'npm' environment and allow direct
# publishing; PyPI's pending publisher names 'pypi'.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Both publish jobs exchange this for short-lived registry credentials.
  id-token: write

jobs:
  release:
    name: verify-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out with the vendored tree
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the test runner and builder
        run: python -m pip install --upgrade pip pytest build

      - name: The tag matches the version in every manifest
        run: |
          python - <<'PYEOF'
          import json
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          version = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]
          adapter = json.loads(Path("adapters/dsh/package.json").read_text())["version"]
          if not (tag == version == adapter):
              raise SystemExit(f"tag {tag}, harness {version}, bridge {adapter}")
          print(f"version {version} agrees with tag {tag}")
          PYEOF

      - name: Contract tests
        run: PYTHONPATH=python/src python -m pytest python/tests -q

      - name: Bridge tests
        run: node --test adapters/dsh/test/

      - name: Vendor pin invariant
        run: tools/check-vendor-pin.sh

      - name: Build the distribution
        run: python -m build python --outdir dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "pact-harness $TAG"
          fi
          existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for file in dist/*; do
            name="$(basename "$file")"
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              echo "$name is already attached; left in place"
            else
              gh release upload "$TAG" "$file"
            fi
          done

      - name: Keep the distribution for the publish jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish-pypi
    needs: release
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI pending publisher.
    environment: pypi
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-npm:
    name: publish-npm
    needs: release
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    # Must match the environment named in npm's trusted publisher configuration.
    environment: npm
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Use Node 24 (npm 11 supports trusted publishing)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish the bridge
        run: |
          cd adapters/dsh
          npm publish --access public
