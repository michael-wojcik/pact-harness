name: release

# A tag is a promise: it says the tree at that commit passed the suite, the pin
# is intact, and the version in every manifest agrees with the tag. This lane
# checks those three before it builds anything, then attaches the artifacts to a
# GitHub release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Trusted Publishing: the PyPI step exchanges this for a short-lived token.
  # Only requested when the step runs; the rest of the lane never uses it.
  id-token: write

jobs:
  release:
    name: verify-and-publish
    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI pending publisher.
    environment: pypi
    steps:
      - name: Check out with the vendored tree
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the test runner and builder
        run: python -m pip install --upgrade pip pytest build

      - name: The tag matches the version in every manifest
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          version = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]
          adapter = json.loads(Path("adapters/dsh/package.json").read_text())["version"]
          if not (tag == version == adapter):
              raise SystemExit(f"tag {tag}, harness {version}, bridge {adapter}")
          print(f"version {version} agrees with tag {tag}")
          PY

      - name: Contract tests
        run: PYTHONPATH=python/src python -m pytest python/tests -q

      - name: Bridge tests
        run: node --test adapters/dsh/test/

      - name: Vendor pin invariant
        run: tools/check-vendor-pin.sh

      - name: Build the distribution
        run: python -m build python --outdir dist

      # gh's own uploader rather than a third-party action: the first run
      # created the release, uploaded the sdist and then failed on the wheel with
      # no message. The CLI reports what the API said, and clobbering is explicit
      # so a rerun converges instead of duplicating assets.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "pact-harness $TAG"
          fi
          existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for file in dist/*; do
            name="$(basename "$file")"
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              echo "$name is already attached; left in place"
            else
              gh release upload "$TAG" "$file"
            fi
          done

      # Opt-in: set the repository variable PYPI_PUBLISH=true after registering a
      # pending publisher on PyPI (owner michael-wojcik, repo pact-harness,
      # workflow release.yml, environment pypi). With the variable unset this step
      # does not run and the release lane behaves as before.
      - name: Publish the Python package to PyPI
        if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      # Opt-in: set NPM_PUBLISH=true and the NPM_TOKEN secret once the
      # @pact-harness scope org exists. Without both, this step does not run.
      - name: Publish the bridge to npm
        if: vars.NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd adapters/dsh
          npm publish --access public
