name: contract

# The contract and the pin are the harness's two load-bearing invariants. This
# lane runs on the same interpreter upstream certifies (3.12) and fails when the
# vendored PACT tree drifts from harness/pact-pin.json.

on:
  push:
    branches: [main]
    # The upstream suite takes most of an hour; a docs-only change cannot move
    # the contract or the pin, so it should not spend that budget.
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: contract-and-pin
    runs-on: ubuntu-latest
    steps:
      - name: Check out with the vendored tree
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Upstream's suite enforces its own environment: scripts/verify_ci_environment.py
      # compares the importable distributions against constraints-ci.txt and exits
      # rather than running with a subset. Mirror upstream's CI install, hash-pinned
      # and binary-only, so the suite sees exactly the reviewed closure.
      - name: Install upstream's pinned environment
        run: |
          python -m pip install --only-binary=:all: --require-hashes \
            -r vendor/pact-plugin/constraints-ci.txt

      - name: Contract tests
        run: PYTHONPATH=python/src python -m pytest python/tests -q

      - name: Vendor pin invariant
        run: tools/check-vendor-pin.sh

      # The pin is only meaningful if the pinned tree satisfies its own tests.
      # This runs the suite against a copy, so the checkout stays clean.
      - name: Upstream suite, unmodified
        run: tools/run-upstream-tests.sh

      - name: Doctor at the lowest tier
        run: PYTHONPATH=python/src python -m pact_harness doctor --require-tier T0
