# harness-compat.yml -- drop this into PACT-Plugin's .github/workflows/.
#
# It answers one question on every upstream pull request: does this change still
# fit the harness? Nothing here changes how the plugin behaves in Claude Code; it
# is an additional, non-blocking signal for the harness, not a requirement on
# upstream.
#
# The harness install spec is a variable so the template does not pin a channel
# that may move. Point it at PyPI once the first release exists, or at a git ref
# while testing:
#
#   PACT_HARNESS_SPEC: "pact-harness"
#   PACT_HARNESS_SPEC: "pact-harness @ git+https://github.com/<owner>/pact-harness@main"
#
# This file is a template, not a workflow of this repository.

name: harness-compat

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: pact-harness-compatibility
    runs-on: ubuntu-latest
    env:
      PACT_HARNESS_SPEC: "pact-harness"
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the harness
        run: python -m pip install --upgrade pip "$PACT_HARNESS_SPEC"

      - name: Does this tree still fit the harness?
        run: pact upstream verify --plugin "$GITHUB_WORKSPACE"
        env:
          PACT_PLUGIN_ROOT: ${{ github.workspace }}
